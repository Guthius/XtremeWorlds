name: Cross-Platform Release

on:
  push:
    tags:
      - "*"  # triggers on any tag

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Publish build output
        run: dotnet publish -c Release -o ./publish

      - name: Create ZIP of build
        shell: bash
        run: |
          # Convert RUNNER_OS to lowercase for consistent naming
          OS=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          ZIP_FILE="xtremeworlds-${OS}-${GITHUB_REF_NAME}.zip"
          cd publish
          zip -r "../$ZIP_FILE" *
          cd ..

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v3
        with:
          # Use toLower() instead of unsupported pipe syntax
          name: xtremeworlds-${{ toLower(matrix.os) }}
          path: xtremeworlds-${{ toLower(matrix.os) }}-${{ github.ref_name }}.zip
