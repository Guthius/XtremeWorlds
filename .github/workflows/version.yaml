name: Release Builds (Client & Server)

on:
  push:
    tags:
      - "v*"   # triggers when you push a new tag like v1.0.0

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore XtremeWorlds.sln

      - name: Build solution
        run: dotnet build XtremeWorlds.sln --configuration Release --no-restore

      - name: Publish client
        run: |
          dotnet publish Source/Client/Client.csproj \
            -c Release -o published/client

      - name: Publish server
        run: |
          dotnet publish Source/Server/Server.csproj \
            -c Release -o published/server

      - name: Archive build
        run: |
          cd published
          zip -r ../xtremeworlds-${{ matrix.os }}.zip .
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xtremeworlds-${{ matrix.os }}
          path: xtremeworlds-${{ matrix.os }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
