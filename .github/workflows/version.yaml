name: Cross-Platform Release

on:
  push:
    tags:
      - "v*"   # runs when you push a tag like v1.0.0

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore XtremeWorlds.sln

      - name: Build
        run: dotnet build XtremeWorlds.sln -c Release --no-restore

      - name: Publish Client
        run: dotnet publish Source/Client/Client.csproj -c Release -o out/client

      - name: Publish Server
        run: dotnet publish Source/Server/Server.csproj -c Release -o out/server

      - name: Package Build
        run: |
          cd out
          zip -r ../xtremeworlds-${{ matrix.os }}-${{ github.ref_name }}.zip *
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xtremeworlds-${{ matrix.os }}-${{ github.ref_name }}
          path: xtremeworlds-${{ matrix.os }}-${{ github.ref_name }}.zip

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
