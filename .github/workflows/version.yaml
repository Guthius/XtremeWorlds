name: Cross-Platform Release

on:
  push:
    tags:
      - "*"  # triggers on any tag

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      # ===== macOS universal build =====
      - name: Publish macOS Client and Server (x64/arm64)
        if: ${{ runner.os == 'macOS' }}
        run: |
          set -e
          CLIENT_PROJ="./Source/Client/Client.csproj"
          SERVER_PROJ="./Source/Server/Server.csproj"

          # Clean old folders
          rm -rf ./tmp-client-x64 ./tmp-client-arm64 ./tmp-server-x64 ./tmp-server-arm64 ./publish-client ./publish-server

          # Publish Client
          dotnet publish "$CLIENT_PROJ" -r osx-x64   -c Release -o ./tmp-client-x64   --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
          dotnet publish "$CLIENT_PROJ" -r osx-arm64 -c Release -o ./tmp-client-arm64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

          # Publish Server
          dotnet publish "$SERVER_PROJ" -r osx-x64   -c Release -o ./tmp-server-x64   --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
          dotnet publish "$SERVER_PROJ" -r osx-arm64 -c Release -o ./tmp-server-arm64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

          # Merge into universal binaries
          mkdir -p ./publish-client
          cp -R ./tmp-client-arm64/* ./publish-client/
          lipo -create ./tmp-client-x64/Client ./tmp-client-arm64/Client -output ./publish-client/Client

          mkdir -p ./publish-server
          cp -R ./tmp-server-arm64/* ./publish-server/
          lipo -create ./tmp-server-x64/Server ./tmp-server-arm64/Server -output ./publish-server/Server

      # ===== Generic publish for Linux/Windows =====
      - name: Publish build output (non-macOS)
        if: ${{ runner.os != 'macOS' }}
        run: dotnet publish -c Release -o ./publish

      # ===== ZIP packaging =====
      - name: Create ZIP on Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          OS=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          cd publish
          zip -r "../xtremeworlds-${OS}-${GITHUB_REF_NAME}.zip" *
          cd ..

      - name: Create ZIP on macOS
        if: ${{ runner.os == 'macOS' }}
        run: |
          which zip || brew install zip
          # Client
          cd publish-client
          zip -r ../xtremeworlds-client-macos-universal-${GITHUB_REF_NAME}.zip *
          cd ..
          # Server
          cd publish-server
          zip -r ../xtremeworlds-server-macos-universal-${GITHUB_REF_NAME}.zip *
          cd ..

      - name: Create ZIP on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          $OS = $env:RUNNER_OS.ToLower()
          $ZIP = "..\xtremeworlds-$OS-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path publish\* -DestinationPath $ZIP

      # ===== Upload artifacts =====
      - name: Upload Linux ZIP
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: xtremeworlds-linux-${GITHUB_REF_NAME}
          path: xtremeworlds-linux-${GITHUB_REF_NAME}.zip

      - name: Upload macOS Client ZIP
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: xtremeworlds-client-macos-universal-${GITHUB_REF_NAME}
          path: xtremeworlds-client-macos-universal-${GITHUB_REF_NAME}.zip

      - name: Upload macOS Server ZIP
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: xtremeworlds-server-macos-universal-${GITHUB_REF_NAME}
          path: xtremeworlds-server-macos-universal-${GITHUB_REF_NAME}.zip

      - name: Upload Windows ZIP
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: xtremeworlds-windows-${GITHUB_REF_NAME}
          path: xtremeworlds-windows-${GITHUB_REF_NAME}.zip
