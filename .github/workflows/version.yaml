name: Cross-Platform Release

on:
  push:
    tags:
      - "*"  # triggers on any tag

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Publish build output
        run: dotnet publish -c Release -o ./publish

      # Linux ZIP
      - name: Create ZIP on Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          OS=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          cd publish
          zip -r "../xtremeworlds-${OS}-${GITHUB_REF_NAME}.zip" *
          cd ..

      # macOS ZIP
      - name: Create ZIP on macOS
        if: ${{ runner.os == 'macOS' }}
        run: |
          which zip || brew install zip
          OS=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          ZIP_FILE="../xtremeworlds-${OS}-${GITHUB_REF_NAME}.zip"
          cd publish
          zip -r "$ZIP_FILE" *
          cd ..

      # Windows ZIP
      - name: Create ZIP on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          $OS = $env:RUNNER_OS.ToLower()
          $ZIP = "..\xtremeworlds-$OS-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path publish\* -DestinationPath $ZIP
