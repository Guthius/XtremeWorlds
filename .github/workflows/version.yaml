name: Cross-Platform Release

on:
  push:
    tags:
      - "*"  # triggers on any tag

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            dotnet restore --runtime linux-x64
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            dotnet restore --runtime win-x64
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            dotnet restore --runtime osx-x64
            dotnet restore --runtime osx-arm64
          fi

      - name: Build
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            dotnet build --configuration Release --no-restore --runtime linux-x64
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            dotnet build --configuration Release --no-restore --runtime win-x64
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            dotnet build --configuration Release --no-restore --runtime osx-x64
            dotnet build --configuration Release --no-restore --runtime osx-arm64
          fi

      - name: Test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            dotnet test --no-build --verbosity normal --runtime linux-x64
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            dotnet test --no-build --verbosity normal --runtime win-x64
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            dotnet test --no-build --verbosity normal --runtime osx-x64
            dotnet test --no-build --verbosity normal --runtime osx-arm64
          fi

      # ===== macOS universal build =====
      - name: Publish macOS Client and Server (x64/arm64)
        if: ${{ runner.os == 'macOS' }}
        run: |
          set -e
          CLIENT_PROJ="./Source/Client/Client.csproj"
          SERVER_PROJ="./Source/Server/Server.csproj"

          rm -rf ./tmp-client-x64 ./tmp-client-arm64 ./tmp-server-x64 ./tmp-server-arm64 ./publish

          # Publish Client
          dotnet publish "$CLIENT_PROJ" -r osx-x64   -c Release -o ./tmp-client-x64   --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
          dotnet publish "$CLIENT_PROJ" -r osx-arm64 -c Release -o ./tmp-client-arm64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

          # Publish Server
          dotnet publish "$SERVER_PROJ" -r osx-x64   -c Release -o ./tmp-server-x64   --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
          dotnet publish "$SERVER_PROJ" -r osx-arm64 -c Release -o ./tmp-server-arm64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

          # Merge into universal binaries
          mkdir -p ./publish/Client
          cp -R ./tmp-client-arm64/* ./publish/Client/
          lipo -create ./tmp-client-x64/Client ./tmp-client-arm64/Client -output ./publish/Client/Client

          mkdir -p ./publish/Server
          cp -R ./tmp-server-arm64/* ./publish/Server/
          lipo -create ./tmp-server-x64/Server ./tmp-server-arm64/Server -output ./publish/Server/Server

      # ===== Generic publish for Linux/Windows =====
      - name: Publish build output (non-macOS)
        if: ${{ runner.os != 'macOS' }}
        run: |
          mkdir -p publish/Client
          mkdir -p publish/Server

          RID=""
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            RID=linux-x64
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            RID=win-x64
          fi

          dotnet publish Source/Client/Client.csproj -c Release -r $RID -o ./publish/Client --self-contained false
          dotnet publish Source/Server/Server.csproj -c Release -r $RID -o ./publish/Server --self-contained false

      # ===== ZIP packaging =====
      - name: Create ZIP package
        run: |
          ZIP_FILE="engine-${RUNNER_OS}.zip"
          cd publish
          zip -r "../$ZIP_FILE" *
          cd ..

      # ===== Upload artifact =====
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: xtremeworlds-${{ runner.os }}
          path: xtremeworlds-${{ runner.os }}.zip
