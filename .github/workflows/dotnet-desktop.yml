name: Release

on:
  push:
    tags:
      - "*"  # triggers on any tag

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore

      # Build Client with OS-appropriate TFM (WPF on Windows)
      - name: Build Client (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: dotnet build Source/Client/Client.csproj -c Release -f net9.0 --no-restore
      - name: Build Client (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: dotnet build Source/Client/Client.csproj -c Release -f net9.0-windows --no-restore

      - name: Build Server
        run: dotnet build Source/Server/Server.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      # Publish Client & Server with platform-specific runtime
      - name: Publish Client (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: dotnet publish Source/Client/Client.csproj -c Release -f net9.0 -r linux-x64 -o ./publish/linux-x64/Client --self-contained true
      - name: Publish Client (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: dotnet publish Source/Client/Client.csproj -c Release -f net9.0-windows -r win-x64 -o ./publish/win-x64/Client --self-contained true

      - name: Publish Server (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: dotnet publish Source/Server/Server.csproj -c Release -r linux-x64 -o ./publish/linux-x64/Server --self-contained true
      - name: Publish Server (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: dotnet publish Source/Server/Server.csproj -c Release -r win-x64 -o ./publish/win-x64/Server --self-contained true

      # macOS: Build, publish, lipo universal, zip, and upload
      - name: Build Client (macOS x64)
        if: ${{ runner.os == 'macOS' }}
        run: dotnet build Source/Client/Client.csproj -c Release -f net9.0 -r osx-x64 --no-restore

      - name: Build Client (macOS arm64)
        if: ${{ runner.os == 'macOS' }}
        run: dotnet build Source/Client/Client.csproj -c Release -f net9.0 -r osx-arm64 --no-restore

      - name: Build Server (macOS x64)
        if: ${{ runner.os == 'macOS' }}
        run: dotnet build Source/Server/Server.csproj --configuration Release -r osx-x64 --no-restore

      - name: Build Server (macOS arm64)
        if: ${{ runner.os == 'macOS' }}
        run: dotnet build Source/Server/Server.csproj --configuration Release -r osx-arm64 --no-restore


      - name: Publish Client (macOS x64, .app)
        if: ${{ runner.os == 'macOS' }}
        run: dotnet publish Source/Client/Client.csproj -c Release -f net9.0 -r osx-x64 -o ./publish/osx-x64/Client --self-contained true /p:PackageFormat=app

      - name: Publish Client (macOS arm64, .app)
        if: ${{ runner.os == 'macOS' }}
        run: dotnet publish Source/Client/Client.csproj -c Release -f net9.0 -r osx-arm64 -o ./publish/osx-arm64/Client --self-contained true /p:PackageFormat=app

      - name: Publish Server (macOS x64, .app)
        if: ${{ runner.os == 'macOS' }}
        run: dotnet publish Source/Server/Server.csproj -c Release -r osx-x64 -o ./publish/osx-x64/Server --self-contained true /p:PackageFormat=app

      - name: Publish Server (macOS arm64, .app)
        if: ${{ runner.os == 'macOS' }}
        run: dotnet publish Source/Server/Server.csproj -c Release -r osx-arm64 -o ./publish/osx-arm64/Server --self-contained true /p:PackageFormat=app

      - name: Create universal .app bundles and ZIP (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          brew install zip || true
          # Universal Client.app
          CLIENT_X64_APP="publish/osx-x64/Client/Client.app"
          CLIENT_ARM_APP="publish/osx-arm64/Client/Client.app"
          CLIENT_UNIVERSAL_APP="publish/macos-universal/Client/Client.app"
          mkdir -p publish/macos-universal/Client
          cp -R "$CLIENT_X64_APP" "$CLIENT_UNIVERSAL_APP"
          lipo -create \
            "$CLIENT_X64_APP/Contents/MacOS/Client" \
            "$CLIENT_ARM_APP/Contents/MacOS/Client" \
            -output "$CLIENT_UNIVERSAL_APP/Contents/MacOS/Client"
          # Universal Server.app
          SERVER_X64_APP="publish/osx-x64/Server/Server.app"
          SERVER_ARM_APP="publish/osx-arm64/Server/Server.app"
          SERVER_UNIVERSAL_APP="publish/macos-universal/Server/Server.app"
          mkdir -p publish/macos-universal/Server
          cp -R "$SERVER_X64_APP" "$SERVER_UNIVERSAL_APP"
          lipo -create \
            "$SERVER_X64_APP/Contents/MacOS/Server" \
            "$SERVER_ARM_APP/Contents/MacOS/Server" \
            -output "$SERVER_UNIVERSAL_APP/Contents/MacOS/Server"
          # Zip the universal .app bundles into a single folder
          cd publish/macos-universal
          mkdir XtremeWorlds-macOS
          mv Client/Client.app XtremeWorlds-macOS/
          mv Server/Server.app XtremeWorlds-macOS/
          zip -r ../../xtremeworlds-macos-${GITHUB_REF_NAME}.zip XtremeWorlds-macOS
          cd ../..


      # Zip and upload Linux build
      - name: Zip Linux build
        if: ${{ runner.os == 'Linux' }}
        run: |
          zip -r xtremeworlds-linux-${GITHUB_REF_NAME}.zip publish/linux-x64

      - name: Upload ZIP on Linux
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: xtremeworlds-linux-${{ github.ref_name }}
          path: xtremeworlds-linux-${{ github.ref_name }}.zip

      # Zip and upload Windows build
      - name: Zip Windows build
        if: ${{ runner.os == 'Windows' }}
        shell: powershells      
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath xtremeworlds-windows-${env:GITHUB_REF_NAME}.zip

      - name: Upload ZIP on Windows
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: xtremeworlds-windows-${{ github.ref_name }}
          path: xtremeworlds-windows-${{ github.ref_name }}.zip
      
      - name: Upload ZIP on macOS
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: xtremeworlds-macos-${{ github.ref_name }}
          path: xtremeworlds-macos-${{ github.ref_name }}.zip

