name: Release

on:
  push:
    tags:
      - "*"  # triggers on any tag

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Clean
        run: dotnet clean

      - name: Restore dependencies
        run: dotnet restore

      # Build Client (Linux)
      - name: Build Client (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: dotnet build src/Client/Client.csproj -c Release -f net9.0 --no-restore

      # Build Client (Windows)
      - name: Build Client (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: dotnet build src/Client/Client.csproj -c Release -f net9.0-windows --no-restore

      - name: Build Server
        run: dotnet build src/Server/Server.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      # Publish Client & Server with platform-specific runtime (excluding macOS builds)
      - name: Publish Client (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: dotnet publish src/Client/Client.csproj -c Release -f net9.0 -r linux-x64 -o ./publish/Client --self-contained true -p:RuntimeIdentifier=linux-x64
      - name: Publish Client (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: dotnet publish src/Client/Client.csproj -c Release -f net9.0-windows -r win-x64 -o ./publish/Client --self-contained true -p:RuntimeIdentifier=win-x64

      - name: Publish Server (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: dotnet publish src/Server/Server.csproj -c Release -r linux-x64 -o ./publish/Server --self-contained true
      - name: Publish Server (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: dotnet publish src/Server/Server.csproj -c Release -r win-x64 -o ./publish/Server --self-contained true

      # Clean up macOS .app folders that may have been created
      - name: Remove macOS app folders (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          find ./publish -name "*.app" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -path "*/osx-x64/*" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -path "*/osx-arm64/*" -type d -exec rm -rf {} + 2>/dev/null || true
      - name: Remove macOS app folders (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          Get-ChildItem -Path ./publish -Recurse -Directory -Name "*.app" | ForEach-Object { Remove-Item -Path $_ -Recurse -Force -ErrorAction SilentlyContinue }
          Get-ChildItem -Path . -Recurse -Directory | Where-Object { $_.FullName -like "*osx-x64*" -or $_.FullName -like "*osx-arm64*" } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      # Zip and upload Linux build
      - name: Zip Linux build
        if: ${{ runner.os == 'Linux' }}
        run: |
          cd publish
          zip -r ../xtremeworlds-linux-${GITHUB_REF_NAME}.zip Client Server
          cd ..

      - name: Upload Zip on Linux
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: xtremeworlds-linux-${{ github.ref_name }}
          path: xtremeworlds-linux-${{ github.ref_name }}.zip

      # Zip and upload Windows build
      - name: Zip Windows build
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          cd publish
          Compress-Archive -Path Client,Server -DestinationPath ../xtremeworlds-windows-${env:GITHUB_REF_NAME}.zip
          cd ..

      - name: Upload Zip on Windows
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: xtremeworlds-windows-${{ github.ref_name }}
          path: xtremeworlds-windows-${{ github.ref_name }}.zip
    

