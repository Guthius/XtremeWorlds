name: Release

on:
  push:
    tags:
      - "*"  # triggers on any tag

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore

      # Build Client with OS-appropriate TFM (WPF on Windows)
      - name: Build Client (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: dotnet build Source/Client/Client.csproj -c Release -f net9.0 --no-restore
      - name: Build Client (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: dotnet build Source/Client/Client.csproj -c Release -f net9.0-windows --no-restore

      - name: Build Server
        run: dotnet build Source/Server/Server.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      # Publish Client & Server with platform-specific runtime
      - name: Publish Client (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: dotnet publish Source/Client/Client.csproj -c Release -f net9.0 -r linux-x64 -o ./publish/linux-x64/Client --self-contained true
      - name: Publish Client (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: dotnet publish Source/Client/Client.csproj -c Release -f net9.0-windows -r win-x64 -o ./publish/win-x64/Client --self-contained true

      - name: Publish Server (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: dotnet publish Source/Server/Server.csproj -c Release -r linux-x64 -o ./publish/linux-x64/Server --self-contained true
      - name: Publish Server (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: dotnet publish Source/Server/Server.csproj -c Release -r win-x64 -o ./publish/win-x64/Server --self-contained true

      # macOS: Build, publish, lipo universal, zip, and upload
      - name: Build Client (macOS x64)
        if: ${{ runner.os == 'macOS' }}
        run: dotnet build Source/Client/Client.csproj -c Release -f net9.0 -r osx-x64 --no-restore

      - name: Build Client (macOS arm64)
        if: ${{ runner.os == 'macOS' }}
        run: dotnet build Source/Client/Client.csproj -c Release -f net9.0 -r osx-arm64 --no-restore

      - name: Build Server (macOS x64)
        if: ${{ runner.os == 'macOS' }}
        run: dotnet build Source/Server/Server.csproj --configuration Release -r osx-x64 --no-restore

      - name: Build Server (macOS arm64)
        if: ${{ runner.os == 'macOS' }}
        run: dotnet build Source/Server/Server.csproj --configuration Release -r osx-arm64 --no-restore

      - name: Publish Client (macOS x64)
        if: ${{ runner.os == 'macOS' }}
        run: dotnet publish Source/Client/Client.csproj -c Release -f net9.0 -r osx-x64 -o ./publish/osx-x64/Client --self-contained true

      - name: Publish Client (macOS arm64)
        if: ${{ runner.os == 'macOS' }}
        run: dotnet publish Source/Client/Client.csproj -c Release -f net9.0 -r osx-arm64 -o ./publish/osx-arm64/Client --self-contained true

      - name: Publish Server (macOS x64)
        if: ${{ runner.os == 'macOS' }}
        run: dotnet publish Source/Server/Server.csproj -c Release -r osx-x64 -o ./publish/osx-x64/Server --self-contained true

      - name: Publish Server (macOS arm64)
        if: ${{ runner.os == 'macOS' }}
        run: dotnet publish Source/Server/Server.csproj -c Release -r osx-arm64 -o ./publish/osx-arm64/Server --self-contained true

      - name: Create universal binaries and ZIP (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          brew install zip || true
          mkdir -p publish/macos-universal/Client
          mkdir -p publish/macos-universal/Server
          # Universal Client
          lipo -create \
            publish/osx-x64/Client/Client \
            publish/osx-arm64/Client/Client \
            -output publish/macos-universal/Client/Client
          cp -R publish/osx-x64/Client/* publish/macos-universal/Client/
          cp -R publish/osx-arm64/Client/* publish/macos-universal/Client/
          mv publish/macos-universal/Client/Client publish/macos-universal/Client/Client_universal
          mv publish/macos-universal/Client/Client_universal publish/macos-universal/Client/Client
          # Universal Server
          lipo -create \
            publish/osx-x64/Server/Server \
            publish/osx-arm64/Server/Server \
            -output publish/macos-universal/Server/Server
          cp -R publish/osx-x64/Server/* publish/macos-universal/Server/
          cp -R publish/osx-arm64/Server/* publish/macos-universal/Server/
          mv publish/macos-universal/Server/Server publish/macos-universal/Server/Server_universal
          mv publish/macos-universal/Server/Server_universal publish/macos-universal/Server/Server
          cd publish/macos-universal
          zip -r ../../xtremeworlds-macos-${GITHUB_REF_NAME}.zip Client Server
          cd ../..

      - name: Upload ZIP on macOS
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: xtremeworlds-macos-${{ github.ref_name }}
          path: xtremeworlds-macos-${{ github.ref_name }}.zip

