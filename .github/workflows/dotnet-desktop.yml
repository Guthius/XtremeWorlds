name: Release

on:
  push:
    tags:
      - "*"  # triggers on any tag

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore

      # Build Client with OS-appropriate TFM (WPF on Windows)
      - name: Build Client (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: dotnet build Source/Client/Client.csproj -c Release -f net9.0 --no-restore
      - name: Build Client (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: dotnet build Source/Client/Client.csproj -c Release -f net9.0-windows --no-restore

      - name: Build Server
        run: dotnet build Source/Server/Server.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      # Publish Client & Server with platform-specific runtime
      - name: Publish Client (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: dotnet publish Source/Client/Client.csproj -c Release -f net9.0 -r linux-x64 -o ./publish/linux-x64/Client --self-contained true
      - name: Publish Client (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: dotnet publish Source/Client/Client.csproj -c Release -f net9.0-windows -r win-x64 -o ./publish/win-x64/Client --self-contained true

      - name: Publish Server (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: dotnet publish Source/Server/Server.csproj -c Release -r linux-x64 -o ./publish/linux-x64/Server --self-contained true
      - name: Publish Server (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: dotnet publish Source/Server/Server.csproj -c Release -r win-x64 -o ./publish/win-x64/Server --self-contained true

            # Linux cleanup and ZIP
      - name: Cleanup old zip files (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: rm -f xtremeworlds-linux-*.zip

      - name: Create ZIP on Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          OS=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          zip -r "xtremeworlds-${OS}-${GITHUB_REF_NAME}.zip" publish/linux-x64/Client publish/linux-x64/Server

      - name: Upload ZIP on Linux
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: xtremeworlds-linux-${{ github.ref_name }}
          path: xtremeworlds-linux-${{ github.ref_name }}.zip

      # Windows cleanup and ZIP
      - name: Cleanup old zip files (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: Remove-Item -Force xtremeworlds-windows-*.zip

      - name: Create ZIP on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          $OS = $env:RUNNER_OS.ToLower()
          $ZIP = "xtremeworlds-$OS-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path publish\win-x64\Client, publish\win-x64\Server -DestinationPath $ZIP

      - name: Upload ZIP on Windows
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: xtremeworlds-${{ env.RUNNER_OS | toLower }}-${{ github.ref_name }}
          path: xtremeworlds-${{ env.RUNNER_OS | toLower }}-${{ github.ref_name }}.zip